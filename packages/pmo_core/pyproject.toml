[project]
name = "pmo-core"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "pyyaml>=6",
  "sqlalchemy>=2,<3",
  "alembic>=1.13",
  "psycopg[binary]>=3,<4",
  "qdrant-client>=1,<2",
  "azure-storage-blob>=12,<13",
  "azure-storage-queue>=12,<13",
  "azure-identity>=1",
  "structlog",
  "httpx",
  "opentelemetry-api",
  "opentelemetry-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmo_core"]
