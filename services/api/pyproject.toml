[project]
name = "askpmo-api"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["pmo-core", "fastapi", "uvicorn[standard]", "python-multipart"]

[tool.uv.sources]
pmo-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
